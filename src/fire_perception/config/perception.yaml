# fire_perception/config/perception.yaml
# ARCHITECTURE.md 4절: HSV 범위, YOLO 경로, 열/가스 점수 변환, 팬 속도.
# STEP4 에서는 비전/팬 관련 값만 채움. thermal/gas 변환 파라미터는 STEP5 에서 추가.

camera_pan_node:
  ros__parameters:
    sweep_speed_rad_s: 0.5        # SWEEP_FRONT 삼각파 각속도
    sweep_min_rad: -1.5708        # -pi/2
    sweep_max_rad: 1.5708         # +pi/2
    search_speed_rad_s: 0.6       # SEARCH_360 각속도
    search_min_rad: -3.14159
    search_max_rad: 3.14159
    track_max_rad_s: 1.0           # TRACK 모드 목표각 추종 시 각속도 제한
    publish_rate_hz: 20.0

# vision_node 는 detector(hsv|yolo) 파라미터로 backend 를 고르지만, ROS2 파라미터 yaml 은
# 노드 이름(=vision_node) 단위로만 매칭되므로 hsv_detector/yolo_detector 파라미터도
# vision_node 절 아래에 함께 둔다(개념적으로만 구분된 절이며 로딩은 하나로 합쳐서 이뤄짐).
vision_node:
  ros__parameters:
    detector: hsv                  # hsv | yolo
    publish_rate_hz: 5.0
    camera_frame: camera_color_optical_frame
    depth_topic: /camera/depth/image_raw
    rgb_topic: /camera/color/image_raw
    camera_info_topic: /camera/color/camera_info
    map_frame: map
    base_frame: base_link
    min_confidence: 0.3

    # -- hsv_detector: 빨강은 Hue 원형이라 두 구간(0 부근, 180 부근)을 OR. OpenCV Hue 범위 0~179. --
    hue_low1: 0
    hue_low2: 10
    hue_high1: 170
    hue_high2: 179
    sat_min: 120
    val_min: 80
    min_area_px: 60
    morph_kernel: 5

    # -- yolo_detector --
    model_path: ""                 # 비어있으면 fire_perception/models/fire_yolov8n.pt 를 기본으로 찾음
    imgsz: 320
    conf_threshold: 0.4
    device: cpu
    class_name: fire

thermal_node:
  ros__parameters:
    # gz-sensors8 ThermalCameraSensor 기본 linear_resolution = 0.01(10mK)
    # (/usr/include/gz/rendering8/gz/rendering/base/BaseThermalCamera.hh:97-98,
    #  ThermalCameraSensor.hh SetLinearResolution 문서: "temperature in kelvin / resolution").
    # min/max_temp 기본 -inf/+inf(클리핑 없음) → raw(uint16, mono16) = K / resolution.
    # fire_description/urdf/gazebo.xacro 의 thermal 센서에 <plugin ThermalSensor> 오버라이드가
    # 없으므로 이 기본값이 그대로 적용된다(실측은 /check 5 에서 real_fire 를 보고 Tmax≈600K 확인).
    linear_resolution: 0.01
    hfov_rad: 0.96
    score_low_k: 330.0
    score_high_k: 450.0
    thermal_frame: thermal_optical_frame
    map_frame: map
    base_frame: base_link
    use_depth_for_range: false
    depth_topic: /camera/depth/image_raw
    depth_hfov_rad: 1.204

virtual_thermal_node:
  ros__parameters:
    width: 32
    height: 24
    hfov_rad: 0.96
    update_rate_hz: 8.0
    linear_resolution: 0.01
    ambient_k: 293.0
    max_range_m: 15.0
    atten_per_m: 0.03
    atten_min_factor: 0.35
    blob_base_radius_px: 2.0
    gaussian_blur_ksize: 3
    noise_std_k: 1.0
    thermal_frame: thermal_optical_frame

gas_sim_node:
  ros__parameters:
    base_ppm: 250.0             # MQ-2 기저 농도
    peak_ppm: 1200.0            # is_real 불 바로 앞(d≈0)에서의 최대 추가 농도 * gas_strength
    sigma_m: 1.5
    tau_s: 2.0                  # 1차 지연 시정수
    noise_std_ppm: 15.0
    rate_hz: 10.0
    score_low_ppm: 400.0        # ARCHITECTURE.md 5절과 동일
    score_high_ppm: 1500.0
    gas_frame: base_link
    enable_gradient_hint: false
    gradient_history_len: 20
    gradient_min_norm: 5.0

dataset_tools:
  ros__parameters:
    raw_dir: data/raw
    dataset_dir: data/fire_yolo
    preview_dir: data/preview
    models_dir: models
    target_images: 280
    background_ratio: 0.2
    collect_interval_s: 0.5
    train_val_split: 0.8
    epochs: 25
    batch: 16
    workers: 2
